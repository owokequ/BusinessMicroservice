databaseChangeLog:
  - changeSet:
      id: create-table-wallets
      author: artem
      changes:
        - createTable:
            tableName: wallets
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
