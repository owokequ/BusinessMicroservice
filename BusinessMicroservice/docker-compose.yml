version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: business 
    environment:
      POSTGRES_DB: business_db   
      POSTGRES_USER: artem
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5434:5432"              
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data: